services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: techflow
      MYSQL_USER: techflow
      MYSQL_PASSWORD: techflow
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - techflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-password"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: mysql
      DATABASE_NAME: techflow
      DATABASE_USER: techflow
      DATABASE_PASSWORD: techflow
      JWT_SECRET: local-development-secret-change-before-sharing-32-bytes
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  techflow-mysql-data:
