# Spring Application Name
spring.application.name=TechFlow Backend

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.technoload.techflow.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties
# Set JWT_SECRET before starting the application. No default secret is bundled with TechFlow.
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# Comma-separated list of browser origins allowed to call the API.
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Concurrency & Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# Transactional outbox relay
outbox.relay.fixed-delay-ms=2000
outbox.relay.batch-size=50
outbox.relay.max-attempts=5
maintenance.preventive.threshold-hours=250
